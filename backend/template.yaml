AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Orion's Eye Backend - capture + image rules

Parameters:
  Environment:
    Type: String
    Default: dev

  CognitoUserPoolArn:
    Type: String
    Default: arn:aws:cognito-idp:us-east-2:219282777127:userpool/us-east-2_I6UCDeRO3

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DEVICES_TABLE: !Ref DevicesTable
        OBSERVATIONS_TABLE: !Ref ObservationsTable
        S3_BUCKET: !Ref ImagesBucket
        IOT_POLICY_NAME: OrionsEyeDevicePolicy-dev
        IOT_DATA_ENDPOINT: a3kjpfhb0sgn22-ats.iot.us-east-2.amazonaws.com

  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !Ref CognitoUserPoolArn

Resources:
  DevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'orions-eye-devices-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ObservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'orions-eye-observations-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: observationId
          AttributeType: S
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: observationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DeviceIdIndex
          KeySchema:
            - AttributeName: deviceId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'orions-eye-images-${Environment}-${AWS::AccountId}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${ImagesBucket.Arn}/*'

  PresignUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'orions-eye-presign-upload-${Environment}'
      CodeUri: lambda/presign_upload/
      Handler: handler.lambda_handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ImagesBucket
      Events:
        Presign:
          Type: Api
          Properties:
            Path: /observations/presign
            Method: POST

  GetDevicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'orions-eye-get-devices-${Environment}'
      CodeUri: lambda/get_devices/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DevicesTable
      Events:
        GetDevices:
          Type: Api
          Properties:
            Path: /devices
            Method: GET

  RegisterDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'orions-eye-register-device-${Environment}'
      CodeUri: lambda/register_device/
      Handler: handler.lambda_handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DevicesTable
        - Statement:
            - Effect: Allow
              Action:
                - iot:CreateThing
                - iot:UpdateThing
                - iot:DescribeThing
                - iot:CreateKeysAndCertificate
                - iot:AttachThingPrincipal
                - iot:AttachPolicy
                - iot:DescribeEndpoint
              Resource: '*'
      Events:
        RegisterDevice:
          Type: Api
          Properties:
            Path: /devices/register
            Method: POST

  SendDeviceCommandFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'orions-eye-send-device-command-${Environment}'
      CodeUri: lambda/send_device_command/
      Handler: handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - iot:Publish
              Resource:
                - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/orionseye/*'
      Events:
        SendCommand:
          Type: Api
          Properties:
            Path: /devices/{deviceId}/command
            Method: POST

  GetObservationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'orions-eye-get-observations-${Environment}'
      CodeUri: lambda/get_observations/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ObservationsTable
      Events:
        GetObservations:
          Type: Api
          Properties:
            Path: /observations
            Method: GET

  GetObservationDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'orions-eye-get-observation-${Environment}'
      CodeUri: lambda/get_observation_detail/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ObservationsTable
      Events:
        GetObservation:
          Type: Api
          Properties:
            Path: /observations/{observationId}
            Method: GET

  ProcessSpectralImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'orions-eye-process-image-${Environment}'
      CodeUri: lambda/process_spectral_image/
      Handler: handler.lambda_handler
      Timeout: 300
      MemorySize: 2048
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ObservationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DevicesTable
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket

  IoTRuleHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'orions-eye-iot-handler-${Environment}'
      CodeUri: lambda/iot_rule_handler/
      Handler: handler.lambda_handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DevicesTable
        - LambdaInvokePolicy:
            FunctionName: !Ref ProcessSpectralImageFunction

  IoTRuleCapture:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub 'orions_eye_capture_${Environment}'
      TopicRulePayload:
        RuleDisabled: false
        AwsIotSqlVersion: '2016-03-23'
        Sql: "SELECT *, topic() as topic FROM 'orionseye/+/capture'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IoTRuleHandlerFunction.Arn

  IoTRuleImage:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub 'orions_eye_image_${Environment}'
      TopicRulePayload:
        RuleDisabled: false
        AwsIotSqlVersion: '2016-03-23'
        Sql: "SELECT *, topic() as topic FROM 'orionseye/+/image'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IoTRuleHandlerFunction.Arn

  IoTRuleHandlerPermissionCapture:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IoTRuleHandlerFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt IoTRuleCapture.Arn

  IoTRuleHandlerPermissionImage:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IoTRuleHandlerFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt IoTRuleImage.Arn

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'

  DevicesTableName:
    Value: !Ref DevicesTable

  ObservationsTableName:
    Value: !Ref ObservationsTable

  ImagesBucketName:
    Value: !Ref ImagesBucket

  IoTEndpoint:
    Description: AWS IoT Core endpoint
    Value: a3kjpfhb0sgn22-ats.iot.us-east-2.amazonaws.com